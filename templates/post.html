<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="{{canonical}}">
  <meta name="description" content="{{description}}">
  <meta property="og:site_name" content="Yusuf Özev">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:title" content="{{title}} | Yusuf Özev">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}} | Yusuf Özev">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <title>{{title}} | Yusuf Özev</title>
  <script type="application/ld+json">{{jsonLd}}</script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a class="brand" href="/">
        <img class="brand-icon" src="/images/logo.svg" alt="YO" width="36" height="36">
        <span class="brand-text">Yusuf Özev</span>
      </a>
      <button class="mobile-menu-button" aria-label="Menüyü aç/kapat">☰</button>
      <nav class="main-nav" id="mainNav">
        <a class="nav-link" href="/">Ana Sayfa</a>
      </nav>
      <div class="header-actions">
        <a class="contact-button" href="/iletisim.html">İletişim</a>
      </div>
    </div>
  </header>
  <main>
    <article class="article-page page-top">
      <div class="container article-shell">
        <aside class="article-toc" id="articleToc" aria-label="Bu yazıda" hidden>
          <div class="article-toc-inner">
            <div class="article-toc-label">Bu yazıda</div>
            <ol class="article-toc-list" id="articleTocList"></ol>
          </div>
        </aside>
        <div class="article-main">
          <div class="article-header">
            <div class="page-kicker">{{category}} / {{subcategory}}</div>
            <h1>{{title}}</h1>
            <p>{{description}}</p>
            <div class="post-meta">{{date}} • {{readTime}}</div>
          </div>
          <nav class="article-toc-mobile" id="articleTocMobile" aria-label="Yazı başlıkları" hidden></nav>
          <div class="article-content" id="articleContent">
{{content}}
          </div>
          <section class="post-comments" id="postComments" aria-label="Yorumlar"></section>
          <a class="back-link" href="/yazilar.html"><span>← Tüm Yazılar</span></a>
        </div>
      </div>
    </article>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026. Tüm hakları saklıdır.</p>
      <div class="footer-links">
        <a href="https://github.com/yusuffozev" target="_blank" rel="noopener">GitHub</a>
        <a href="#" target="_blank" rel="noopener">LinkedIn</a>
        <a href="mailto:info@yusufozev.com.tr">Mail</a>
      </div>
    </div>
  </footer>
  <script src="/script.js"></script>
</body>
</html>
